[General]
__userfile__=true
panels=panel1
iconTheme=Papirus-Light

[fancymenu]
ownIcon=true
alignment=Left
autoSel=true
autoSelDelay=150
filterClear=true
icon=@HOME@/.local/share/macos-theme/apple-menu-dark.svg
showText=false
type=fancymenu

[panel1]
alignment=1
desktop=0
hidable=false
iconSize=18
lineCount=1
panelSize=30
plugins=statusnotifier, tray, volume, spotlight, worldclock
position=Top
reserve-space=true
width=40
width-percent=true
hide-on-overlap=false
visible-margin=false
animation-duration=200
show-delay=150
background-color=#f2f2f2
opacity=100
font-color=#1d1d1f

[spacer]
alignment=Left
expandable=true
type=spacer
spaceType=invisible

[statusnotifier]
alignment=Right
type=statusnotifier
autoHideList=lubuntu-update, qlipper

[tray]
alignment=Right
type=tray

[volume]
alignment=Right
device=0
type=volume

[worldclock]
alignment=Right
customFormat=ddd d MMM  h:mm AP
formatType=custom
showWeekNumber=false
type=worldclock
useAdvancedManualFormat=true

[spotlight]
type=customcommand
alignment=Right
icon=@HOME@/.local/share/icons/WhiteSur/actions/symbolic/system-search-symbolic.svg
click=@HOME@/.local/share/macos-theme/spotlight
tooltip=Spotlight
command=
text=
repeat=false
